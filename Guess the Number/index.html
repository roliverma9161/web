<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-card">
        <h1>🎯 Guess The Number</h1>
        <p>1 se 100 ke beech ka number guess karo!</p>
    
        <div class="input-section">
            <input type="number" id="user-guess" placeholder="Enter number..." min="1" max="100">
            <button id="guess-btn" onclick="checkGuess()">Submit</button>
        </div>
        <p id="message" class="message">Game shuru ho chuki hai!</p>
        <p id="attempts" class="attempts">Attempts: 0</p>
        <button id="restart-btn" class="hidden" onclick="restartGame()">Play Again 🔄</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
